name: Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Kind Cluster
    runs-on: [self-hosted, Windows, X64]

    steps:
      # ----------------------------------------------------
      # 1️⃣  Checkout code
      # ----------------------------------------------------
      - name: 🧾 Checkout repo
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # 2️⃣  Build & Push Docker Images to Docker Hub
      # ----------------------------------------------------
      - name: 🐳 Log in to Docker Hub via Podman
        shell: powershell
        run: |
          Write-Host "Logging in to Docker Hub via Podman..."
          podman login docker.io -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"

      - name: 🧩 Ensure Podman machine is running
        shell: powershell
        run: |
          Write-Host "Checking Podman machine status..."
          $status = podman machine list | Select-String "Running"
          if (-not $status) {
            Write-Host "Starting Podman machine..."
            podman machine init --now
          } else {
            Write-Host "Podman machine is already running."
          }
        
      - name: 🏗️ Build and Push Backend & Frontend Images with Podman...
        shell: powershell
        run: |
          $imageTag = "${{ github.sha }}"
          $dockerUser = "${{ secrets.DOCKER_USERNAME }}"
      
          Write-Host "Building backend image..."
          podman build -t docker.io/$dockerUser/backend:$imageTag -f ./Application-k8s/backend/Dockerfile ./Application-k8s/backend
          podman push docker.io/$dockerUser/backend:$imageTag
      
          Write-Host "Building frontend image..."
          podman build -t docker.io/$dockerUser/frontend:$imageTag -f ./Application-k8s/frontend/Dockerfile ./Application-k8s/frontend
          podman push docker.io/$dockerUser/frontend:$imageTag


      # ----------------------------------------------------
      # 3️⃣  Ensure kubeconfig points to Kind cluster
      # ----------------------------------------------------
      - name: ⚙️ Set up Kubeconfig for Kind cluster...
        shell: powershell
        run: |
          Write-Host "Generating kubeconfig for Kind cluster 'three-tier'..."
          if (-Not (Test-Path "$HOME\.kube")) {
            New-Item -ItemType Directory -Path "$HOME\.kube" | Out-Null
          }
          kind get kubeconfig --name three-tier | Out-File "$HOME\.kube\config" -Encoding UTF8
          $kubePath = Join-Path $HOME ".kube\config"
          Write-Host "✅ Kubeconfig written to $kubePath"

      - name: 🔍 Verify cluster connection...
        shell: powershell
        run: |
          Write-Host "Checking Kind cluster status..."
          kubectl cluster-info
          kubectl get nodes

      # ----------------------------------------------------
      # 4️⃣  Clean up any old MySQL PVC
      # ----------------------------------------------------
      - name: 🧹 Clean existing MySQL PVC (Safe JSON Patch)...
        shell: powershell
        run: |
          Write-Host "Checking and cleaning existing MySQL PVC..."
          $pvcName = "mysql-storage-mysql-0"
          $namespace = "three-tier"

          $pvcExists = kubectl get pvc $pvcName -n $namespace --ignore-not-found
          if (-not $pvcExists) {
            Write-Host "No existing PVC found. Skipping cleanup."
            exit 0
          }

          Write-Host "PVC found. Attempting to remove finalizers (if stuck)..."
          $patchDir = "C:\Temp"
          if (!(Test-Path $patchDir)) { New-Item -ItemType Directory -Path $patchDir | Out-Null }
          $patchFile = Join-Path $patchDir "pvc_patch.json"
          Set-Content -Path $patchFile -Value '{"metadata":{"finalizers":[]}}'

          kubectl patch pvc $pvcName -n $namespace --type merge --patch-file $patchFile 2>$null
          kubectl delete pvc $pvcName -n $namespace --ignore-not-found --grace-period=0 --force --wait=false
          Write-Host "PVC cleanup step complete."

      - name: ⏳ Wait for PVC to terminate completely...
        shell: powershell
        run: |
          Write-Host "Waiting for old MySQL PVC to fully terminate..."
          $pvcName = "mysql-storage-mysql-0"
          $namespace = "three-tier"
          $timeout = 60
          $elapsed = 0
          while ($elapsed -lt $timeout) {
            $exists = kubectl get pvc $pvcName -n $namespace --ignore-not-found
            if (-not $exists) {
              Write-Host "PVC $pvcName has been deleted."
              break
            }
            Write-Host "PVC still terminating... waiting 5 seconds..."
            Start-Sleep -Seconds 5
            $elapsed += 5
          }

      # ----------------------------------------------------
      # 5️⃣  Update K8s manifests with new image tags
      # ----------------------------------------------------
      - name: 🧱 Update K8s manifests with new image tags...
        shell: powershell
        run: |
          Write-Host "Updating Kubernetes manifests with new image tag..."
          $imageTag = "${{ github.sha }}"
          $dockerUser = "ayushicybage"

          # Full repo names
          $backendRepo = "docker.io/$dockerUser/backend"
          $frontendRepo = "docker.io/$dockerUser/frontend"

          $backendFile = "$PWD/Application-k8s/backend-deployment.yaml"
          $frontendFile = "$PWD/Application-k8s/frontend-deployment.yaml"

          Write-Host ("Updating backend image to {0}:{1}" -f $backendRepo, $imageTag)
          (Get-Content $backendFile) -replace 'image: .*', ("image: {0}:{1}" -f $backendRepo, $imageTag) | Set-Content $backendFile

          Write-Host ("Updating frontend image to {0}:{1}" -f $frontendRepo, $imageTag)
          (Get-Content $frontendFile) -replace 'image: .*', ("image: {0}:{1}" -f $frontendRepo, $imageTag) | Set-Content $frontendFile

          Write-Host ("✅ All manifests updated with image tag: {0}" -f $imageTag)

      # ----------------------------------------------------
      # 6️⃣  Ensure Namespace Exists
      # ----------------------------------------------------
      - name: 🌐 Ensure namespace exists...
        shell: powershell
        run: |
          Write-Host "Ensuring 'three-tier' namespace exists..."
          kubectl get ns three-tier 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Namespace not found. Creating..."
            kubectl create ns three-tier
          } else {
            Write-Host "Namespace already exists."
          }

      # ----------------------------------------------------
      # 7️⃣  Apply Kubernetes manifests
      # ----------------------------------------------------
      - name: 🚀 Apply Kubernetes manifests...
        shell: powershell
        run: |
          Write-Host "🚀 Applying all YAML manifests from ./Application-k8s ..."
          Get-ChildItem -Path "./Application-k8s/" -Filter *.yaml -Recurse |
          ForEach-Object {
            Write-Host "Applying $($_.Name)..."
            kubectl apply -f $_.FullName -n three-tier --validate=false
          }

      # ----------------------------------------------------
      # 8️⃣  Verify deployment
      # ----------------------------------------------------
      - name: ✅ Verify deployment status...
        shell: powershell
        run: |
          Write-Host "Listing pods and services in 'three-tier' namespace..."
          kubectl get pods -n three-tier
          kubectl get svc -n three-tier
