name: Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Kind Cluster
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: 🧾 Checkout repo
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # 1️⃣  Ensure kubeconfig points to your Kind cluster
      # ----------------------------------------------------
      - name: ⚙️ Set up Kubeconfig for Kind cluster
        shell: powershell
        run: |
          Write-Host "Generating kubeconfig for Kind cluster 'three-tier'..."
          if (-Not (Test-Path "$HOME\.kube")) {
            New-Item -ItemType Directory -Path "$HOME\.kube" | Out-Null
          }
          kind get kubeconfig --name three-tier | Out-File "$HOME\.kube\config" -Encoding UTF8
          $kubePath = Join-Path $HOME ".kube\config"
          Write-Host "Kubeconfig written to $kubePath"


      - name: 🔍 Verify cluster connection
        shell: powershell
        run: |
          Write-Host "Checking Kind cluster status..."
          kubectl cluster-info
          kubectl get nodes

      # ----------------------------------------------------
      # 2️⃣  Clean up any old MySQL PVC
      # ----------------------------------------------------
      - name: 🧹 Clean existing MySQL PVC (Safe JSON Patch)
        shell: powershell
        run: |
          Write-Host "Checking and cleaning existing MySQL PVC..."
          $pvcName = "mysql-storage-mysql-0"
          $namespace = "three-tier"

          $pvcExists = kubectl get pvc $pvcName -n $namespace --ignore-not-found
          if (-not $pvcExists) {
            Write-Host "No existing PVC found. Skipping cleanup."
            exit 0
          }

          Write-Host "PVC found. Attempting to remove finalizers (if stuck)..."

          $patchDir = "C:\Temp"
          if (!(Test-Path $patchDir)) { New-Item -ItemType Directory -Path $patchDir | Out-Null }
          $patchFile = Join-Path $patchDir "pvc_patch.json"
          Set-Content -Path $patchFile -Value '{"metadata":{"finalizers":[]}}'

          kubectl patch pvc $pvcName -n $namespace --type merge --patch-file $patchFile 2>$null
          kubectl delete pvc $pvcName -n $namespace --ignore-not-found --grace-period=0 --force --wait=false
          Write-Host "PVC cleanup step complete."

      - name: ⏳ Wait for PVC to terminate completely
        shell: powershell
        run: |
          Write-Host "Waiting for old MySQL PVC to fully terminate..."
          $pvcName = "mysql-storage-mysql-0"
          $namespace = "three-tier"
          $timeout = 60
          $elapsed = 0
          while ($elapsed -lt $timeout) {
            $exists = kubectl get pvc $pvcName -n $namespace --ignore-not-found
            if (-not $exists) {
              Write-Host "PVC $pvcName has been deleted."
              break
            }
            Write-Host "PVC still terminating... waiting 5 seconds..."
            Start-Sleep -Seconds 5
            $elapsed += 5
          }

      # ----------------------------------------------------
      # 3️⃣  Update K8s manifests with new image tags
      # ----------------------------------------------------
      - name: 🧱 Update K8s manifests with new image tags
        shell: powershell
        run: |
          Write-Host "Updating Kubernetes manifests with new image tag..."

          $imageTag = "${{ github.sha }}"
          $dockerUser = "${{ secrets.DOCKER_USERNAME }}"

          # --- Install yq manually (no Chocolatey needed) ---
          $yqUrl = "https://github.com/mikefarah/yq/releases/latest/download/yq_windows_amd64.exe"
          Write-Host "Downloading yq from $yqUrl ..."
          Invoke-WebRequest -Uri $yqUrl -OutFile "C:\yq.exe"
          $env:Path += ";C:\"
          yq --version

          # --- Backend image update ---
          $backendRepo = "$dockerUser/backend"
          Write-Host "Updating backend image to ${backendRepo}:${imageTag}"
          yq eval -i ".spec.template.spec.containers[0].image = `"${backendRepo}:${imageTag}`"" "./Application-k8s/backend-deployment.yaml"

          # --- Frontend image update ---
          $frontendRepo = "$dockerUser/frontend"
          Write-Host "Updating frontend image to ${frontendRepo}:${imageTag}"
          yq eval -i ".spec.template.spec.containers[0].image = `"${frontendRepo}:${imageTag}`"" "./Application-k8s/frontend-deployment.yaml"

          Write-Host "All manifests updated with image tag: ${imageTag}"

      # ----------------------------------------------------
      # 4️⃣  Deploy all manifests to Kind cluster
      # ----------------------------------------------------
      - name: 🚀 Apply Kubernetes manifests
        shell: powershell
        run: |
          Write-Host "🚀 Applying all YAML manifests from ./Application-k8s ..."
          Get-ChildItem -Path "./Application-k8s/" -Filter *.yaml -Recurse |
          Where-Object { $_.FullName -notmatch "\\.github\\" } |
          ForEach-Object {
            Write-Host "Applying $($_.Name)..."
            kubectl apply -f $_.FullName -n three-tier --validate=false
          }

      # ----------------------------------------------------
      # 5️⃣  Verify deployment
      # ----------------------------------------------------
      - name: ✅ Verify deployment status
        shell: powershell
        run: |
          Write-Host "Listing pods and services in 'three-tier' namespace..."
          kubectl get pods -n three-tier
          kubectl get svc -n three-tier
